name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cornerstone
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Build / migrate target.
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/cornerstone?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/cornerstone?schema=public"
      # Tests use a SEPARATE database: the test suite force-resets its schema via
      # `prisma db push`, which would otherwise leave the build's
      # `prisma migrate deploy` to fail with P3005 (schema not empty).
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/cornerstone_test?schema=public"
      TEST_DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/cornerstone_test?schema=public"
      SESSION_SECRET: "ci-test-secret"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Create test database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c 'CREATE DATABASE cornerstone_test;'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
